name: build-and-push

# 触发策略：
#   - push main：只跑校验（go vet + test + bean-check + 版本一致），不产镜像
#     → 相当于免费的 CI 守护，每次提交就知道有没有破坏账芯
#   - push tag v*：校验通过后构建 amd64+arm64 并推送 Docker Hub。
#     镜像标签分两档：
#       * 版本号 tag（如 :0.6.4-pre）—— 所有 v* tag / 手动 push_image 都打；
#       * :latest —— 只有「正式 tag」（严格 vX.Y.Z，如 v0.6.4）才打，
#         非正式 tag / 手动 dispatch 绝不覆盖 :latest，避免预发布版本顶掉稳定版。
#     Release 同样只给正式 tag 创建 —— Release 会把 tag 钉住，导致无法强推/移动 tag。
#     正式 tag 才允许 Release（notes 取 CHANGELOG.md 对应版本段落）。
#   - workflow_dispatch：手动触发；默认只校验，勾选 push_image 才真正推镜像
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      push_image:
        description: '同时构建并推送镜像到 Docker Hub'
        type: boolean
        default: false

env:
  # 镜像名沿用老板既有的 Docker Hub 仓库名（money-mint），
  # 与 docker-compose.yml 的默认镜像保持一致，改一处必须同步另一处。
  IMAGE_NAME: money-mint

jobs:
  # ---------- 第一道门：校验不过，绝不产出镜像 ----------
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_release_tag: ${{ steps.tagclass.outputs.is_release_tag }}
    steps:
      - name: Check Server Performance(检查服务器性能)
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - uses: actions/checkout@v6
        with:
          # verify-version.sh 需要 tag 才能比对，浅克隆只有 1 个提交拿不到 tag
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 关键：必须真的装上 beancount。
      # 若此步静默失败，后续 go test 会因 BEAN_CHECK_STRICT=1 而失败 —— 这正是设计意图：
      # 宁可构建失败，也不要「测试全绿但账芯从未被校验」的假绿灯。
      - name: Install beancount (bean-check)
        run: |
          python -m pip install --upgrade pip
          pip install beancount
          python -m beancount.scripts.check --help >/dev/null

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\]' CHANGELOG.md | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?')"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "解析出版本：${V}"

      # tag 分类门禁：只有严格 SemVer 正式版 vX.Y.Z 才允许后续创建 Release。
      # 非正式 tag（如 v0.6.4-pre）只跑校验或至多构建，绝不建 Release：
      # Release 会把 tag 钉住，导致无法强推 / 移动 tag。
      - name: Classify tag (判定是否正式 SemVer tag)
        id: tagclass
        run: |
          RELEASE_TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" =~ $RELEASE_TAG_RE ]]; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME} → 正式 SemVer tag，允许创建 Release"
          else
            echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}（ref_type=${GITHUB_REF_TYPE}）→ 非正式 tag，跳过 Release"
          fi

      - name: Verify version consistency
        run: bash scripts/verify-version.sh "${{ steps.ver.outputs.version }}"

      - name: go vet
        run: go vet ./...

      - name: go test (strict bean-check)
        env:
          BEAN_CHECK_STRICT: '1'
        run: go test ./... -v

      - name: bean-check self check
        run: bash scripts/check-bean.sh

  # ---------- 第二道门：前端门禁（web-verify，批 6 补齐） ----------
  # RK-10：门禁必须覆盖 vitest + build，且用例数有下限防「文件加载失败只剩 3 个用例」的假绿。
  # Node 版本经 node-version-file 读 frontend/.nvmrc（22.23.4），与 Dockerfile / engines 三处一致。
  web-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci（engine-strict 校验 Node 版本）
        working-directory: frontend
        run: npm ci

      - name: Vitest 全量 + 用例数/文件数下限（防假绿）
        working-directory: frontend
        env:
          # 两个下限都必填：用例下限防「静默少收集」，文件下限防「删一个文件」。
          # 只增不减；每次加测试后按实测值上调（验收时统一抬）。
          # 当前实测：132 文件 / 1361 用例（i18n 阶段 2 子批 4~7：交易域 / core 收敛 / 记一笔 / 五视图）
          TEST_FLOOR: '1361'       # 有效用例数（已扣除 skip/todo）；下限 == 实测值时，少一条即红
          TEST_FILE_FLOOR: '132'   # 测试文件数；用例下限对「删一个文件」几乎无感，靠这条兜
        run: |
          npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json
          node ../scripts/check-test-floor.mjs vitest-report.json "$TEST_FLOOR" "$TEST_FILE_FLOOR"

      - name: 类型检查（vue-tsc）
        working-directory: frontend
        run: npm run typecheck

      - name: 构建（vue-tsc + vite build，es2015 产物）
        working-directory: frontend
        run: npm run build

      - name: 兼容门禁（es2020 语法 + §14.7 API/CSS 特性扫描）
        working-directory: frontend
        run: npm run compat

  # ---------- 第三道门：双架构构建并推送 ----------
  # 仅两种情况产镜像：
  #   1) 推 tag v*（正式发布）
  #   2) 手动 workflow_dispatch 且勾选了 push_image
  # 普通分支 push 只跑前面的校验，不会动 Docker Hub。
  build:
    needs: [verify, web-verify]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check Server Performance(检查服务器性能)
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build info
        id: info
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 标签渲染：版本号 tag 恒打；:latest 仅正式 SemVer tag（is_release_tag=true）才打。
      # 用 GITHUB_OUTPUT 多行值喂给 build-push-action 的 tags，避免把条件塞进 YAML 字面量。
      # 非正式 tag（v0.6.4-pre / v1.2.3-rc.1）与手动 dispatch 只出版本号 tag，
      # 绝不覆盖 :latest —— 预发布不得顶掉稳定版。
      - name: Resolve image tags
        id: tags
        env:
          IMAGE_REF: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.verify.outputs.version }}
          IS_RELEASE_TAG: ${{ needs.verify.outputs.is_release_tag }}
        run: |
          {
            echo "list<<TAGS_EOF"
            echo "${IMAGE_REF}:${VERSION}"
            if [ "${IS_RELEASE_TAG}" = "true" ]; then
              echo "${IMAGE_REF}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "镜像标签："
          if [ "${IS_RELEASE_TAG}" = "true" ]; then
            echo "  ${IMAGE_REF}:${VERSION}  ${IMAGE_REF}:latest"
          else
            echo "  ${IMAGE_REF}:${VERSION}  （非正式 tag / 手动触发，不打 :latest）"
          fi

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # arm64 是 NAS 的主力架构，必须与 amd64 一起产出
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ steps.info.outputs.date }}
            BUILD_HASH=${{ steps.info.outputs.hash }}
            GIT_VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          # Node/Vite 构建较 Flutter 轻量，但 gha 缓存仍能省掉 npm ci 与重复编译
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE_REF: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.verify.outputs.version }}
          IS_RELEASE_TAG: ${{ needs.verify.outputs.is_release_tag }}
        run: |
          {
            echo "### 镜像已发布"
            echo ""
            echo "- 版本：\`${VERSION}\`"
            echo "- 架构：linux/amd64, linux/arm64"
            echo "- 标签：\`${IMAGE_REF}:${VERSION}\`"
            if [ "${IS_RELEASE_TAG}" = "true" ]; then
              echo "      并打 \`:latest\`（正式 SemVer tag）"
            else
              echo "      未打 \`:latest\`（非正式 tag / 手动触发，避免覆盖稳定版）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- 发布收尾：仅正式 tag 构建成功后创建 GitHub Release ----------
  # 只依赖 verify.tagclass 的判定结果：is_release_tag == 'true'（严格 vX.Y.Z）才执行。
  # 非正式 tag（如 v0.6.4-pre）即使构建成功也绝不创建 Release，
  # 因为 Release 会把 tag 钉住，导致无法强推 / 移动 tag；正式 tag 才允许 Release。
  # 同时依赖 build：镜像失败则不出 Release。
  # release notes 直接取 CHANGELOG.md 中 "## [x.y.z]" 到下一个 "## [" 之间的正文，
  # 保证「变更记录」只有一个事实源，不在 Release 里另写一份。
  # 幂等：同一 tag 重跑 workflow 时已存在则跳过，不会报错。
  # 注意：若仓库 Actions 默认 token 只读，需在 Settings → Actions → General
  # 把 Workflow permissions 设为 Read and write；本 job 已声明 contents: write。
  release:
    # verify 必须与 build 并列写进 needs，才能引用 needs.verify.outputs.version
    # 与 needs.verify.outputs.is_release_tag
    # （GitHub 的 needs 上下文只含本 job 直接依赖的作业，不含传递依赖）
    needs: [verify, build]
    if: needs.verify.outputs.is_release_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          # 用 index() 精确匹配标题行前缀，避开版本号里 "." 被当正则通配的问题
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "::warning::CHANGELOG.md 中未找到 $VERSION 段落，回退为简短说明"
            echo "版本 $VERSION，变更详见仓库 CHANGELOG.md。" > notes-body.md
          fi
          echo "---- release notes ----"
          cat notes-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes-body.md \
              --verify-tag
          fi

      - name: Release summary
        run: |
          {
            echo "### GitHub Release"
            echo ""
            echo "- Tag：\`${GITHUB_REF_NAME}\`（notes 取 CHANGELOG.md 对应段落）"
          } >> "$GITHUB_STEP_SUMMARY"
